[package]
name = "tmux-status"
version = "0.3.3"
edition = "2024"
rust-version = "1.95"
description = "Native, streaming system metrics for tmux on Linux and macOS"
license = "MIT"
repository = "https://github.com/lidongpeng36/tmux-status"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
starship-battery = "0.12.0"
fs2 = "0.4"
signal-hook = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots", "system-proxy", "socks"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["event"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
